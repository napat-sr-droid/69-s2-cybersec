services:
  db:
    image: postgres:16-alpine
    container_name: 69-s2-db
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data-postgres:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4:latest
    container_name: 69-s2-admin
    ports:
      - "${PGADMIN_DEFAULT_PORT}:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - ./data-pgadmin:/var/lib/pgadmin

  app:
    image: prawee/strapi
    container_name: 69-s2-app
    ports:
      - "${APP_PORT}:1337"
    environment:
      - DATABASE_CLIENT=${DATABASE_CLIENT}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      - ./data-app:/srv/app
      # Override: wrap email send in try/catch inside users-permissions forgot-password
      # (the image has no real SMTP provider, so a failed send previously returned 500).
      # The reset code is still stored in the DB, so /api/auth/reset-password works end-to-end.
      - ./docker-override/auth.js:/opt/node_modules/@strapi/plugin-users-permissions/server/controllers/auth.js:ro
  